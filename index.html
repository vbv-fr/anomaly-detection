<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anomaly Detection Module</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
:root{
  --f-primary:#ff4301;
  --gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-300:#d1d5db;--gray-400:#9ca3af;
  --gray-500:#6b7280;--gray-600:#4b5563;--gray-700:#374151;--gray-800:#1f2937;--gray-900:#111827;
  --red-50:#fef2f2;--red-300:#fca5a5;--red-500:#ef4444;--red-700:#b91c1c;
  --ok:#23C16B;--muted:#B4B6B8;
  --or-50:#fff7ed;--or-300:#fdba74;--or-800:#9a3412;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.5;color:#000;background:#fff;min-width:1280px;overflow:hidden}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
svg{display:block}
[hidden]{display:none!important}

/* ---------- Vision shell ---------- */
.v-side{position:fixed;left:0;top:0;bottom:0;width:80px;background:#1e1c1c;border-right:1px solid var(--gray-300);padding:24px 8px;display:flex;flex-direction:column;align-items:center;z-index:50}
.v-side .logo{width:58px;margin:12px 0 40px}
.v-side .logo svg{width:58px;height:auto}
.v-side ul{list-style:none;margin:32px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;width:100%}
.v-side li{display:flex;justify-content:center;padding:8px 0;border-radius:6px}
.v-side li.active,.v-side li:hover{background:rgba(255,255,255,.2)}
.v-side .home{margin-top:auto;padding:8px 0}
.v-main{margin-left:80px;height:100vh;display:flex;flex-direction:column}
.v-heading{margin-top:4px;height:60px;padding:16px 20px;display:flex;align-items:center;background:#fff;flex:none}
.crumb{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--gray-500);padding:8px 4px}
.crumb .lnk{font-weight:500;color:var(--gray-600);border-radius:4px;padding:0 2px}
.crumb .lnk:hover{color:var(--f-primary);background:var(--gray-100)}
.crumb .dis{font-weight:500;color:var(--gray-600)}
.crumb .cur{font-weight:600;color:var(--gray-900)}
.crumb .chev{color:var(--gray-400)}
.v-body{height:calc(100vh - 125px);display:flex;background:#f3f3f3;overflow:hidden;flex:none}
.v-foot{height:61px;border-top:1px solid #000;padding:10px;display:flex;align-items:center;justify-content:space-between;background:#fff;flex:none;position:relative}

/* image pane */
.img-pane{flex:1.45 1 0;min-width:0;background:#F0F0F0;border-right:1px solid var(--gray-600);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#cv{display:block}
#cv.draw{cursor:crosshair}

/* workflow tree */
.tree-pane{flex:1 1 0;min-width:0;position:relative;overflow:hidden;background:#f3f3f3}
.tree{position:absolute;left:50%;top:24px;transform-origin:top center}
.node{position:absolute;width:300px;height:80px;background:#fff;border:1px solid #333;border-radius:5px;font-size:12px;padding:10px 12px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.node.unconf{background:#E7E7FF40}
.node.click{cursor:pointer}
.node .nm{display:flex;align-items:center;gap:8px;font-size:14px}
.node .nm svg{width:20px;height:20px;flex:none}
.node .st{color:var(--muted)}
.node .st.ok{color:var(--ok)}
.node .fn{font-size:16px;color:#000}
.plus{position:absolute;width:24px;height:24px;border-radius:50%;border:1px dashed var(--f-primary);color:var(--f-primary);display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;background:#fff}

/* config panel */
.panel{width:350px;flex:none;background:#fff;box-shadow:-2px 4px 4px 2px #00000025;display:flex;flex-direction:column;z-index:2;min-height:0}
.cfg-head{background:#e3e5e5;font-size:18px;font-weight:500;padding:10px;display:flex;align-items:center;justify-content:space-between}
.cfg-head .t{display:flex;align-items:center;gap:6px}
.cfg-head .t svg{height:20px;width:20px}
.cfg-head .x{background:none;border:0;padding:2px;display:flex}
.cfg-step{font-size:12px;padding:5px 10px;border-bottom:1px solid #000;display:flex;gap:10px;align-items:center}
.cfg-step .on{font-weight:700}
.cfg-body{flex:1;overflow:auto;padding:10px 10px 30px;scrollbar-width:none;min-height:0}
.cfg-body::-webkit-scrollbar{display:none}
.cfg-foot{display:flex;justify-content:center;gap:8px;padding:8px 0}

/* atoms */
.lbl{font-size:14px;color:#000;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.lbl.b{font-weight:500}
.lbl .info{color:var(--gray-400);display:inline-flex;cursor:help}
.sec-t{font-size:13px;font-weight:500}
.hr{border:0;border-top:1px solid var(--gray-400);margin:4px 0 10px}
.divider{border-top:2px solid var(--muted);margin-top:16px;padding-top:16px}
.row{display:flex;align-items:center;gap:10px}
.row .lbl{margin:0;white-space:nowrap;font-weight:500}
.mt8{margin-top:8px}.mt12{margin-top:12px}
.hint{font-size:12px;color:var(--gray-500)}
.err{font-size:12px;color:var(--red-500);margin-top:2px}
.err10{font-size:10px;color:var(--red-500);margin-top:2px}
.inp-wrap{position:relative}
.inp{width:100%;border:1px solid var(--gray-200);border-radius:6px;padding:8px 12px;font-size:14px;color:#000;background:#fff;outline:none}
.inp:focus{outline:2px solid var(--f-primary);outline-offset:-1px}
.inp.end{padding-right:60px}
.inp.bad{border-color:var(--red-500)}
.inp[disabled]{background:var(--gray-100);color:var(--gray-700);font-weight:500;cursor:default}
.inp-end{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--gray-500);pointer-events:none;font-variant-numeric:tabular-nums}
.note{border:1px solid var(--or-300);background:var(--or-50);color:var(--or-800);font-size:12px;border-radius:4px;padding:6px 12px;margin-top:6px}
.alert{border:1px solid var(--red-300);background:var(--red-50);color:var(--red-700);font-size:12px;border-radius:4px;padding:6px 12px;margin-top:10px}
.alert a{color:var(--f-primary);font-weight:600;text-decoration:underline;cursor:pointer}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:12px;color:var(--gray-600);background:var(--gray-50);border:1px solid var(--gray-200);border-radius:6px;padding:8px 12px;margin-top:8px;font-variant-numeric:tabular-nums}
.kv b{font-weight:600;color:var(--gray-900);text-align:right}
/* shared Radio look: 24px circle, orange fill + white dot when checked */
.radios{display:flex;gap:28px;margin-top:6px}
.rd{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;position:relative}
.rd input{position:absolute;opacity:0;width:1px;height:1px}
.rd .c{width:24px;height:24px;border-radius:50%;border:1px solid var(--gray-300);background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.rd input:checked + .c{background:var(--f-primary);border-color:var(--f-primary)}
.rd input:checked + .c::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.rd input:focus-visible + .c{outline:2px solid var(--f-primary);outline-offset:2px}
.rd.off{opacity:.45;cursor:not-allowed}
.cb-row{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;cursor:pointer}
.cb-row input{width:16px;height:16px;accent-color:#f97316;margin:0}
/* shared Checkbox look (outputs) */
.ck{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0}
.ck .bx{width:20px;height:20px;border-radius:6px;border:1px solid #D9D9D9;box-shadow:0 1px 1px #7A7E8055;display:flex;align-items:center;justify-content:center;background:#fff;flex:none}
.ck .bx.on{background:var(--gray-400);border-color:var(--gray-400)}
.ck .bx.on::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.ck.dim{color:#9ca3af}

/* select */
.sel{position:relative;width:100%}
.sel-btn{width:100%;min-width:95px;text-align:left;border:1px solid var(--gray-300);border-radius:6px;background:#fff;padding:8px 40px 8px 12px;font-size:14px;color:#000;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel-btn.sm{padding:4px 32px 4px 8px;font-size:13px}
.sel-btn .ph{color:var(--gray-400)}
.sel-btn .ar{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--gray-400)}
.sel-btn:disabled{background:var(--gray-100);color:var(--gray-400);cursor:not-allowed}
.sel-list{position:fixed;z-index:200;background:#fff;border:1px solid var(--gray-200);border-radius:6px;box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);padding:4px 0;max-height:240px;overflow:auto;font-size:14px}
.sel-opt{padding:8px 12px 8px 32px;position:relative;cursor:pointer;white-space:nowrap}
.sel-opt:hover{background:var(--f-primary);color:#fff}
.sel-opt .tick{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--f-primary)}
.sel-opt:hover .tick{color:#fff}

/* multiselect */
.ms{border:1px solid #ccc;border-radius:4px;min-height:38px;padding:3px 6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;cursor:text;position:relative;background:#fff}
.ms .chip{background:#f1f1f1;border-radius:15px;padding:2px 4px 2px 10px;font-size:13px;display:flex;align-items:center;gap:2px}
.ms .chip button{border:0;background:none;color:#555;padding:0 4px;font-size:14px;line-height:1;border-radius:50%}
.ms .chip button:hover{background:#ffbdad;color:#de350b}
.ms .ph{color:#999;font-size:14px;padding-left:4px}
.ms .ar{margin-left:auto;color:#ccc;padding:0 4px;border-left:1px solid #ccc}

/* class chips + labels */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.cchip{border-radius:6px;font-size:14px;font-weight:500;padding:2px 10px;border:1px solid;cursor:pointer;background:none}
.cchip.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--gray-500),0 1px 3px rgba(0,0,0,.2)}
.confirm-bar{display:flex;justify-content:center;gap:8px;margin-top:10px}
.lbl-list{margin-top:12px}
.lbl-list .h{font-size:14px;font-weight:500;margin-bottom:6px}
.lrow{border:1px solid var(--gray-300);border-radius:6px;padding:6px 10px;margin-bottom:6px;font-size:14px}
.lrow.bad{background:var(--red-300)}
.lrow .top{display:flex;align-items:center;gap:8px}
.lrow .top .sel{flex:1}
.lrow .ic{display:flex;gap:6px;color:var(--gray-500)}
.lrow .ic button{border:0;background:none;padding:2px;color:inherit;display:flex}
.lrow .ic button:hover{color:var(--gray-900)}
.lrow .sz{font-size:11.5px;color:var(--gray-600);margin:3px 0 0 22px;font-variant-numeric:tabular-nums}
.lrow.bad .sz{color:#7f1d1d;font-weight:500}
.empty{font-size:14px;font-style:italic;color:#888;margin-top:12px}

/* priority card (existing single-class output mode) */
.card{border:1px solid var(--gray-200);border-radius:6px;background:#fff;margin-top:12px}
.card-h{background:var(--gray-50);border-bottom:1px solid var(--gray-200);padding:8px 16px;font-size:12px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.05em}
.card-b{padding:12px}
.card-f{border-top:1px dashed var(--gray-300);padding:12px;text-align:center}
.card-f button{border:0;background:none;color:#f97316;font-size:14px;font-weight:500}
.card-f button:disabled{opacity:.4;cursor:not-allowed}
.prow{padding:8px 0;border-bottom:1px solid var(--gray-100)}
.prow .l1,.prow .l2{display:flex;align-items:center;gap:8px}
.prow .l2{margin-top:6px;padding-right:25px}
.prow .p{font-size:13px;white-space:nowrap;color:var(--gray-700)}
.prow .tr{border:0;background:none;color:var(--gray-400);padding:2px;display:flex}
.prow .tr:hover{color:var(--red-500)}
.single-card{border:1px solid var(--gray-200);border-radius:6px;padding:16px;margin-top:12px}
.single-card .lbl{font-weight:500;color:var(--gray-700)}
.req{color:var(--red-500)}

/* buttons */
.btn{font-size:14px;font-weight:600;padding:8px 24px;border-radius:6px;border:1px solid var(--f-primary);line-height:1.4}
.btn-p{background:var(--f-primary);color:#fff}
.btn-p:hover{opacity:.9}
.btn-b{background:transparent;color:var(--f-primary)}
.btn-sm{padding:5px 16px;font-weight:500}
.btn:disabled{background:var(--gray-300);border-color:var(--gray-300);color:var(--gray-500);cursor:not-allowed;opacity:1}

/* footer */
.ib{width:40px;height:40px;border-radius:8px;border:1px solid var(--f-primary);background:transparent;color:var(--f-primary);display:flex;align-items:center;justify-content:center}
.ib.dis{background:var(--gray-100);border-color:var(--gray-300);color:var(--gray-400);cursor:default}
.f-left{display:flex;gap:8px}
.pill{width:290px;padding:4px 14px;border:1px solid #e7e5e4;background:#fafaf9;border-radius:999px;display:flex;align-items:center;gap:10px;font-size:14px}
.pill .dots{display:flex;gap:6px}
.pill .dot{width:8px;height:8px;border-radius:50%;background:#d6d3d1}
.pill .dot.a{background:var(--f-primary);transform:scale(1.15)}
.pill .cnt{color:#78716c;font-weight:500;white-space:nowrap}
.pill .stp{font-weight:600;color:#292524;display:flex;align-items:center;gap:4px;white-space:nowrap}
.tools{display:flex;gap:24px;padding:0 16px;list-style:none;margin:0}
.tools li{padding:8px;color:#000;display:flex;align-items:center}
.tools li.off{opacity:.3}
.tools li.act{color:var(--f-primary)}
.tools .oo{font-size:12px;font-weight:600}
.brush-pop{position:absolute;bottom:62px;background:#fff;border:1px solid var(--gray-200);border-radius:8px;box-shadow:0 10px 15px -3px rgba(0,0,0,.12);padding:10px 12px;font-size:13px;display:flex;align-items:center;gap:10px;z-index:60}
.brush-pop .pen{display:flex;align-items:center;gap:4px;color:var(--f-primary);font-weight:600}
.brush-pop input{accent-color:var(--f-primary);width:120px}
.brush-pop .v{font-variant-numeric:tabular-nums;color:var(--gray-600);min-width:44px;text-align:right}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:300}
.modal{background:#fff;border-radius:8px;width:440px;max-width:90vw}
.modal .mh{padding:20px;border-bottom:1px solid var(--gray-200);font-weight:600}
.modal .mb{padding:20px;font-size:14px;color:var(--gray-700)}
.modal .mf{padding:12px 20px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--gray-200)}
.modal .mf.rev{flex-direction:row-reverse;justify-content:flex-start}
#toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:400;align-items:center}
.toast{background:#fff;color:#363636;border-radius:8px;padding:8px 12px;font-size:14px;box-shadow:0 3px 10px rgba(0,0,0,.1),0 3px 3px rgba(0,0,0,.05);display:flex;align-items:center;gap:8px;max-width:420px;animation:tin .25s ease}
.toast .ti{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex:none}
.toast .ti.e{background:#ff4b4b}.toast .ti.s{background:#61d345}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
:focus-visible{outline:2px solid var(--f-primary);outline-offset:2px}

/* anomaly module additions */
.radios.col{flex-direction:column;gap:10px}
.sel-opt.dis{color:#c0c4cc;cursor:not-allowed}
.sel-opt.dis:hover{background:none;color:#c0c4cc}
.gen{width:100%}
.unit-row{display:grid;grid-template-columns:1fr 84px;gap:8px}
.gt-head{font-size:11px;color:var(--gray-500);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.gt-item{padding:8px 0;border-top:1px solid var(--gray-100)}
.gt-c{font-size:14px;font-weight:500;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gt-line{display:flex;align-items:center;gap:6px}
.gt-op{width:76px;flex:none}
.gt-op .sel-btn{min-width:0}
.gt-line .inp{flex:1 1 0;min-width:0;padding:5px 8px}
.gt-line .amp{font-size:11px;color:var(--gray-500);flex:none}
.gt-line .pct{font-size:13px;color:var(--gray-500);flex:none;width:12px}
/* tooltip (dark, like the product's material-tailwind Tooltip) */
.tip{position:fixed;z-index:500;background:#1f2937;color:#fff;font-size:12px;line-height:1.4;padding:6px 10px;border-radius:6px;max-width:240px;pointer-events:none;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.lbl .info{cursor:help}
</style>
</head>

<script>
'use strict';
/* =========================================================
   Anomaly Detection module prototype
   Two models sit behind the "Model type" choice (names are not shown in the UI):
     precise -> U-Net        (fine detail, slower per crop)
     broad   -> DINOv3-seg   (patch-level detail, faster per crop)
   Both take a 512 x 512 input. Each crop of the search area is resized to 512.
   ========================================================= */
const MASTER = {w: 5472, h: 3648, file: 'bracket_plate_master.bmp'};
const MODEL_IN = 512;
// need = pixels an anomaly needs after resizing to 512 (ASSUMED); timing on a typical edge GPU in ms (ASSUMED)
const MODELS = [
  {id: 'precise', name: 'Precise detection, slow inferencing', need: 8,  first: 30, extra: 15},
  {id: 'broad',   name: 'Broad detection, quick inferencing',  need: 12, first: 10, extra: 3},
];
const CROPS = [512, 768, 1024, 1536, 2048, 3072];        // candidate crop sizes, smallest first
const PREP_MS_PER_MP = 1.5;
const OPS = [{id: 'eq', name: '='}, {id: 'lt', name: '<'}, {id: 'gt', name: '>'}, {id: 'between', name: 'b/w'}];
// Output of MASK_1: the plate region of SA_0, everything outside the plate mask is black
const SEARCH_AREAS = [
  {id: 'mask1-plate', name: 'Plate (masked)', x: 736, y: 324, w: 4000, h: 3000,
   mask: {x: 936, y: 524, w: 3600, h: 2600, r: 72}},
];
const PROJECT_CLASSES = ['scratch', 'dent', 'stain', 'pit'];

/* ---------- state ---------- */
const line = (x1, y1, x2, y2, n = 60) => Array.from({length: n + 1}, (_, i) => [x1 + (x2 - x1) * i / n, y1 + (y2 - y1) * i / n]);
const S = {
  panelOpen: true,
  step: 1,
  saId: 'mask1-plate',
  classes: ['scratch', 'dent'],
  modelId: 'precise',
  labels: [
    {id: 1, cls: 'scratch', shape: {strokes: [{pts: line(1500, 900, 2700, 1500), w: 40}]}},
    {id: 2, cls: 'dent',    shape: {strokes: [{pts: [[3555, 2300], [3645, 2300]], w: 140}]}},
  ],
  nextId: 3,
  activeClass: null,
  draft: null,
  brush: 6,
  hover: null,              // brush cursor position (master px) while labelling
  generated: false,         // after the first "Generate", details update live
  flash: null,
  details: null,            // result of "Generate Processing Details"
  ratio: '',
  unit: 'px',
  gt: {scratch: {op: 'eq', v: ['0', '']}, dent: {op: 'eq', v: ['0', '']}},
  labelsChanged: false,
  configured: false,
};

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sa = () => SEARCH_AREAS.find(a => a.id === S.saId);
const model = () => MODELS.find(m => m.id === S.modelId);
const ratio = () => { const t = String(S.ratio).trim(); if (!t) return null; const r = Number(t); return isFinite(r) && r > 0 ? r : NaN; };
const ratioOk = () => { const r = ratio(); return r !== null && !Number.isNaN(r); };
const plural = (n, one, many) => n === 1 ? one : many;
const fmtTime = ms => ms < 1000 ? `≈ ${Math.max(5, Math.round(ms / 5) * 5)} ms` : `≈ ${(ms / 1000).toFixed(1)} s`;
// px value in the chosen unit
function inUnit(px, unit = S.unit) {
  const r = ratio();
  if (unit === 'mm' && ratioOk()) return (px * r < 0.005 ? '<0.01' : (px * r).toFixed(2)) + ' mm';
  if (unit === 'um' && ratioOk()) return Math.round(px * r * 1000) + ' µm';
  return Math.round(px) + ' px';
}

function toast(msg, kind = 'e') {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span class="ti ${kind}">${kind === 'e' ? '✕' : '✓'}</span><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 3600);
}
function modal(title, body, okText, onOk, variant = 'confirm') {
  const h = $('#modalHost');
  const btns = variant === 'confirm'
    ? `<div class="mf rev"><button class="btn btn-p btn-sm" data-m="o">${esc(okText)}</button><button class="btn btn-p btn-sm" data-m="c">Cancel</button></div>`
    : `<div class="mf"><button class="btn btn-b btn-sm" data-m="c">Cancel</button><button class="btn btn-p btn-sm" data-m="o">${esc(okText)}</button></div>`;
  h.innerHTML = `<div class="ov"><div class="modal" role="dialog" aria-modal="true"><div class="mh">${esc(title)}</div><div class="mb">${esc(body)}</div>${btns}</div></div>`;
  h.onclick = e => { const b = e.target.closest('[data-m]'); if (!b) { if (e.target.classList.contains('ov')) h.innerHTML = ''; return; } h.innerHTML = ''; if (b.dataset.m === 'o') onOk(); };
}

/* ---------- segment geometry (master px) ---------- */
const allPts = sh => sh.strokes.flatMap(s => s.pts);
const maxW = sh => Math.max(...sh.strokes.map(s => s.w));
// [width, length]: sides of the segment's minimum-area rectangle (principal axes of the painted points)
function segDims(sh) {
  const P = allPts(sh), w = maxW(sh);
  if (P.length < 2) return [w, w];
  let mx = 0, my = 0; P.forEach(p => { mx += p[0]; my += p[1]; }); mx /= P.length; my /= P.length;
  let cxx = 0, cyy = 0, cxy = 0; P.forEach(([x, y]) => { const dx = x - mx, dy = y - my; cxx += dx * dx; cyy += dy * dy; cxy += dx * dy; });
  const th = 0.5 * Math.atan2(2 * cxy, cxx - cyy), ux = Math.cos(th), uy = Math.sin(th);
  let a0 = Infinity, a1 = -Infinity, b0 = Infinity, b1 = -Infinity;
  P.forEach(([x, y]) => { const a = x * ux + y * uy, b = -x * uy + y * ux; a0 = Math.min(a0, a); a1 = Math.max(a1, a); b0 = Math.min(b0, b); b1 = Math.max(b1, b); });
  const e1 = a1 - a0 + w, e2 = b1 - b0 + w;
  return [Math.round(Math.min(e1, e2)), Math.round(Math.max(e1, e2))];
}
function segArea(sh) {
  return sh.strokes.reduce((t, s) => { let L = 0; for (let i = 1; i < s.pts.length; i++) L += Math.hypot(s.pts[i][0] - s.pts[i - 1][0], s.pts[i][1] - s.pts[i - 1][1]); return t + L * s.w + Math.PI * (s.w / 2) ** 2; }, 0);
}
function segBBox(sh) {
  const P = allPts(sh), r = maxW(sh) / 2;
  return [Math.min(...P.map(p => p[0])) - r, Math.min(...P.map(p => p[1])) - r, Math.max(...P.map(p => p[0])) + r, Math.max(...P.map(p => p[1])) + r];
}

/* =========================================================
   Generate Processing Details
   Picks the LARGEST crop at which the smallest drawn anomaly is still detectable.
   Smaller anomaly -> smaller crop -> more crops -> longer inference.
   Anomalies thinner than the model's need even at the smallest 512 px crop are
   flagged as undetectable (live, as soon as they are confirmed).
   ========================================================= */
function cropDims(c) { const a = sa(); return c === 'full' ? [a.w, a.h] : [Math.min(c, a.w), Math.min(c, a.h)]; }
function minPxFor(c, m = model()) { const [w, h] = cropDims(c), s = Math.min(1, MODEL_IN / w, MODEL_IN / h); return Math.ceil(m.need / s - 1e-9); }
function boxAxis(len, box, ov) {
  if (len <= box) return [0];
  const n = Math.ceil((len - box) / (box - ov)) + 1, st = (len - box) / (n - 1);
  return Array.from({length: n}, (_, i) => Math.round(i * st));
}
// too small for the selected model even at the smallest crop (512 px, no downscaling)
const tooSmall = l => segDims(l.shape)[0] < minPxFor(CROPS[0]);
const flaggedNow = () => S.labels.filter(tooSmall);
const labelNo = l => S.labels.indexOf(l) + 1;
function generate() {
  if (!S.labels.length) { S.details = null; return; }
  const m = model(), a = sa();
  const smallest = Math.min(...S.labels.map(l => segDims(l.shape)[0]));
  const cands = [...CROPS.filter(c => c < Math.max(a.w, a.h)), 'full'];
  let crop = CROPS[0];                                   // smallest crop when even 512 is not enough
  cands.forEach(c => { if (minPxFor(c, m) <= smallest) crop = c; });
  const [cw, ch] = cropDims(crop), minPx = minPxFor(crop, m), ov = minPx;
  const xs = crop === 'full' ? [0] : boxAxis(a.w, cw, ov), ys = crop === 'full' ? [0] : boxAxis(a.h, ch, ov);
  const n = xs.length * ys.length;
  const ms = m.first + m.extra * (n - 1) + PREP_MS_PER_MP * a.w * a.h / 1e6;
  S.details = {crop, cw, ch, minPx, ov, xs, ys, n, ms, smallest};
}
const refresh = () => { if (S.generated) generate(); };

/* ---------- class colours (name hash, like ClassChip) ---------- */
function hue(name) { let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; }
function clsColor(name, a = 1) { return `hsla(${hue(name)},85%,38%,${a})`; }

/* =========================================================
   Synthetic master image (rendered once at 1/4 scale)
   ========================================================= */
const OS = 0.25;
const sharp = document.createElement('canvas'), blurred = document.createElement('canvas');
function buildImage() {
  const W = MASTER.w * OS, H = MASTER.h * OS;
  sharp.width = blurred.width = W; sharp.height = blurred.height = H;
  const g = sharp.getContext('2d');
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  g.fillStyle = '#2a2c2f'; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 2600; i++) { g.fillStyle = `rgba(255,255,255,${rnd() * .04})`; g.fillRect(rnd() * W, rnd() * H, 2, 2); }
  g.fillStyle = '#3b3e42'; g.fillRect(40, 300, 150, 300); g.fillRect(W - 190, 300, 150, 300);
  const m = SEARCH_AREAS[0].mask, px = m.x * OS, py = m.y * OS, pw = m.w * OS, ph = m.h * OS;
  const grad = g.createLinearGradient(px, py, px + pw, py + ph);
  grad.addColorStop(0, '#aeb4ba'); grad.addColorStop(.5, '#d6dadf'); grad.addColorStop(1, '#a9afb6');
  g.save(); g.beginPath(); g.roundRect(px, py, pw, ph, m.r * OS); g.fillStyle = grad; g.fill(); g.clip();

function syncTools() {
  const on = S.panelOpen && S.step === 1 && !!S.activeClass;
  $('#tBrush').className = on ? 'act' : 'off';
  cv.classList.toggle('draw', on);
  const pop = $('#brushPop');
  pop.hidden = !on;
  if (on) { const b = $('#tBrush').getBoundingClientRect(), f = $('.v-foot').getBoundingClientRect(); pop.style.left = Math.min(f.width - 290, b.left - f.left - 120) + 'px'; }
  $('#pageNext').className = 'ib' + (S.configured ? '' : ' dis');
}
function gtErr(g) {
  if (!g || !g.op) return 'Please select an operator';
  const ok = v => v !== undefined && v !== '' && +v >= 0 && +v <= 100;
  if (!ok(g.v[0]) || (g.op === 'between' && !ok(g.v[1]))) return 'Values must be 0-100';
  if (g.op === 'between' && +g.v[0] >= +g.v[1]) return 'Left value must be < right value';
  return '';
}
function setupBlocked() {
  if (!S.classes.length) return true;
  if (S.classes.some(c => !S.labels.some(l => l.cls === c))) return true;
  if (!S.details || flaggedNow().length) return true;
  if (Number.isNaN(ratio())) return true;
  return S.classes.some(c => gtErr(S.gt[c]));
}
function renderFoot() {
  const back = S.step === 0 ? 'Exit' : 'Back', next = S.step === 2 ? 'Finish' : 'Next';
  const dis = S.step === 1 && setupBlocked();
  $('#pfoot').innerHTML = `<button class="btn btn-b" id="pBack">${back}</button><button class="btn btn-p" id="pNext" ${dis ? 'disabled' : ''}>${next}</button>`;
}

function stepInputs() {
  return `<label class="lbl">Base Search Area</label>
    ${selHTML('sa', S.saId, SEARCH_AREAS.map(a => ({id: a.id, name: a.name})), {ph: 'Select base search area', sm: true})}`;
}

function labelsBlock() {
  if (!S.classes.length) return `<div style="font-size:14px;color:#f87171">Select at least one class from the dropdown to label it.</div>`;
  const a = sa(), flagged = flaggedNow(), bad = new Set(flagged.map(l => l.id));
  let h = `<div style="font-size:14px;font-weight:500">Click the classes below to label them in the search area:</div>
    <div class="chips">${S.classes.map(n => `<button class="cchip ${S.activeClass === n ? 'on' : ''}" data-chip="${esc(n)}" style="color:${clsColor(n)};background:${clsColor(n, .2)};border-color:${clsColor(n, .45)}">${esc(n)}</button>`).join('')}</div>`;
  if (S.activeClass) h += `<div class="confirm-bar"><button class="btn btn-b btn-sm" data-act="cancelDraw">Cancel</button><button class="btn btn-p btn-sm" data-act="confirmDraw" ${S.draft && S.draft.strokes.length ? '' : 'disabled'}>Confirm</button></div>`;
  if (!S.labels.length) return h + `<div class="empty">No templates annotated yet</div>`;
  h += `<div class="lbl-list"><div class="h">Current class labels for the image</div>`;
  S.labels.forEach((l, i) => {
    const [wd, ln] = segDims(l.shape), pct = segArea(l.shape) / (a.w * a.h) * 100, isBad = bad.has(l.id);
    const msg = isBad ? `Width ${inUnit(wd)} · too small to detect, even with a 512 px crop`
      : `W ${inUnit(wd)} × L ${inUnit(ln)} · ${pct < 0.01 ? '<0.01' : pct.toFixed(2)}% of search area`;
    h += `<div class="lrow ${isBad ? 'bad' : ''}">
      <div class="top"><span>${i + 1}.</span>${selHTML('lc' + l.id, l.cls, S.classes.map(n => ({id: n, name: n})), {sm: true})}
      <span class="ic"><button data-act="view" data-id="${l.id}" aria-label="View label"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button><button aria-label="Edit label"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button><button data-act="del" data-id="${l.id}" aria-label="Delete label"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></span></div>
      <div class="sz">${esc(msg)}</div></div>`;
  });
  if (flagged.length) h += `<div class="alert" role="alert">${smallMsg(flagged)}</div>`;
  return h + '</div>';
}
// "Label 3 (scratch) is too small …" / "Labels 3 and 4 are too small …"
function smallMsg(list) {
  const names = list.map(l => `${labelNo(l)} (${l.cls})`);
  const joined = names.length === 1 ? names[0] : names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
  return `${plural(list.length, 'Label', 'Labels')} ${esc(joined)} ${plural(list.length, 'is', 'are')} too small to detect, even with the smallest 512 px crop. Remove or redraw ${plural(list.length, 'it', 'them')}.`;
}

const INFO_ICON = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>`;
const info = tip => `<span class="info" data-tip="${esc(tip)}" aria-label="${esc(tip)}" tabindex="0">${INFO_ICON}</span>`;

// static part of Processing Details: the button and the ratio input (kept out of re-renders)
function procBlock() {
  const ratioBad = Number.isNaN(ratio());
  return `<div class="sec-t">Processing Details</div><hr class="hr">
    <button class="btn btn-p btn-sm gen" data-act="gen" ${S.labels.length ? '' : 'disabled'}>Generate Processing Details</button>
    <div id="procDyn">${procDynamic()}</div>
    <div id="ratioWrap" ${S.details ? '' : 'hidden'}>
      <label class="lbl mt12" for="ratio">Ratio (pixel to mm)</label>
      <div class="inp-wrap"><input id="ratio" class="inp end ${ratioBad ? 'bad' : ''}" type="text" inputmode="decimal" autocomplete="off" placeholder="ratio" value="${esc(S.ratio)}"><span class="inp-end">mm / px</span></div>
      <div id="ratioErr">${ratioBad ? '<div class="err">Enter a number greater than 0</div>' : ''}</div>
    </div>`;
}
function procDynamic() {
  const d = S.details;
  if (!d) return S.labels.length ? '' : '<div class="hint mt8">Label at least one anomaly to generate processing details.</div>';
  const m = model();
  const cropTxt = d.crop === 'full' ? `${d.cw} × ${d.ch} px (entire search area)` : `${d.cw} × ${d.ch} px`;
  const minTip = `Each ${d.cw} × ${d.ch} px crop is resized to ${MODEL_IN} × ${MODEL_IN} px. An anomaly needs about ${m.need} px after resizing.`;
  const timeTip = `Rough estimate on a typical edge GPU for ${d.n} ${plural(d.n, 'crop', 'crops')}. Measure on the target PC.`;
  return `<div class="kv"><span>Crop size</span><b>${cropTxt}</b>${d.crop === 'full' ? '' : `<span>Overlap</span><b>≥ ${d.ov} px</b>`}<span>Crops per search area</span><b>${d.n}${d.n > 1 ? ` (${d.xs.length} × ${d.ys.length})` : ''}</b></div>
    <label class="lbl mt12">Inference time ${info(timeTip)}</label>
    <input class="inp" disabled value="${fmtTime(d.ms)}" aria-label="Inference time">
    <label class="lbl mt12">Minimum detectable anomaly ${info(minTip)}</label>
    <div class="unit-row"><input class="inp" id="minVal" disabled value="${esc(inUnit(d.minPx).replace(/ (px|mm|µm)$/, ''))}" aria-label="Minimum detectable anomaly">${selHTML('unit', S.unit, unitOptions(), {})}</div>`;
}

function gtBlock() {
  let h = `<div class="sec-t">Ground Truth Values</div><hr class="hr">`;
  if (!S.classes.length) return h + `<div class="hint">Select anomaly classes first.</div>`;
  h += `<div class="gt-head">Condition for OK · % of search area</div>`;
  S.classes.forEach(c => {
    const g = S.gt[c] || (S.gt[c] = {op: 'eq', v: ['0', '']}), er = gtErr(g);
    const num = k => `<input class="inp" type="number" min="0" max="100" step="0.01" placeholder="Value" data-gt="${esc(c)}" data-k="${k}" value="${esc(g.v[k] ?? '')}" aria-label="${esc(c)} value${g.op === 'between' ? ' ' + (k + 1) : ''}">`;
    h += `<div class="gt-item"><div class="gt-c" style="color:${clsColor(c)}">${esc(c)}</div>
      <div class="gt-line"><div class="gt-op">${selHTML('gtop:' + c, g.op, OPS, {sm: true})}</div>${num(0)}${g.op === 'between' ? `<span class="amp">&amp;</span>${num(1)}` : ''}<span class="pct">%</span></div>
      ${er ? `<div class="err10">${esc(er)}</div>` : ''}</div>`;
  });
  return h;
}

function stepSetup() {
  return `<div class="sec-t">Choose Anomaly Classes</div><hr class="hr">
    <div class="ms" data-ms="1">${S.classes.map(n => `<span class="chip">${esc(n)}<button data-rm="${esc(n)}" aria-label="Remove ${esc(n)}">×</button></span>`).join('') || '<span class="ph">Select classes...</span>'}<span class="ar">▾</span></div>
    ${!S.classes.length ? '<div class="err">Please select at least 1 anomaly class.</div>' : ''}
    <label class="lbl b mt12">Model type</label>
    ${selHTML('model', S.modelId, MODELS.map(m => ({id: m.id, name: m.name})), {disabled: !S.classes.length})}
    <div class="divider" id="lblDyn">${labelsBlock()}</div>
    ${S.classes.length ? `<div class="divider" id="procSec">${procBlock()}</div>` : ''}
    <div class="divider" id="gtSec">${gtBlock()}</div>`;
}

function stepOutputs() {
  const ck = (on, text, dim) => `<div class="ck ${dim ? 'dim' : ''}"><span class="bx ${on ? 'on' : ''}"></span>${esc(text)}</div>`;
  return `<div style="font-size:16px">The following anomaly classes' binary masks will be passed to the next module:</div>
    <div class="mt8">${S.classes.map(n => ck(true, n, false)).join('')}</div>
    <div style="font-size:16px;font-weight:500;border-top:1px solid var(--gray-200);margin-top:12px;padding-top:10px">Other properties</div>
    ${ck(true, 'OK / NG result from Ground Truth Values', false)}`;
}

/* ---------- events ---------- */
const body = $('#body');
body.addEventListener('click', e => {
  const t = e.target;
  const sb = t.closest('[data-sel]');
  if (sb && !sb.disabled) {
    const k = sb.dataset.sel;
    if (k === 'sa') return openSelect(sb, SEARCH_AREAS.map(a => ({id: a.id, name: a.name})), S.saId, v => { S.saId = v; renderBody(); drawCanvas(); });
    if (k === 'unit') return openSelect(sb, unitOptions(), S.unit, v => { S.unit = v; renderDynamic(); });
    if (k === 'model') return openSelect(sb, MODELS.map(m => ({id: m.id, name: m.name})), S.modelId, v => { S.modelId = v; renderBody(); drawCanvas(); });
    if (k.startsWith('gtop:')) { const c = k.slice(5); return openSelect(sb, OPS, S.gt[c].op, v => { S.gt[c].op = v; renderBody(); }); }
    if (k.startsWith('lc')) { const id = +k.slice(2); return openSelect(sb, S.classes.map(n => ({id: n, name: n})), S.labels.find(l => l.id === id).cls, v => { S.labels.find(l => l.id === id).cls = v; S.labelsChanged = true; renderBody(); drawCanvas(); }); }
  }
  const rm = t.closest('[data-rm]');
  if (rm) {
    e.stopPropagation(); closeList(); const n = rm.dataset.rm;
    return modal('Confirm Removal', `Are you sure you want to remove "${n}" from selection?`, 'Confirm', () => {
      S.classes = S.classes.filter(c => c !== n);
      S.labels = S.labels.filter(l => l.cls !== n);
      delete S.gt[n];
      if (S.activeClass === n) { S.activeClass = null; S.draft = null; }
      S.labelsChanged = true; renderBody(); drawCanvas();
    });
  }
  const ms = t.closest('[data-ms]');
  if (ms) { const left = PROJECT_CLASSES.filter(n => !S.classes.includes(n)); return openSelect(ms, left.map(n => ({id: n, name: n})), null, v => { S.classes.push(v); S.gt[v] = {op: 'eq', v: ['0', '']}; renderBody(); drawCanvas(); }); }
  const chip = t.closest('[data-chip]');
  if (chip) {
    const n = chip.dataset.chip;
    if (S.draft && S.draft.strokes.length && S.activeClass !== n) return toast('Confirm annotation to proceed');
    S.activeClass = S.activeClass === n ? null : n; if (!S.activeClass) S.draft = null;
    renderDynamic(); drawCanvas(); return;
  }
  const act = t.closest('[data-act]');
  if (!act) return;
  const a = act.dataset.act;
  if (a === 'gen') {
    if (S.draft && S.draft.strokes.length) return toast('Confirm annotation to proceed');
    S.generated = true; generate(); $('#ratioWrap').hidden = false; renderDynamic(); drawCanvas(); return;
  }
  if (a === 'cancelDraw') { S.draft = null; S.activeClass = null; renderDynamic(); drawCanvas(); return; }
  if (a === 'confirmDraw' && S.draft && S.draft.strokes.length) {
    const nl = {id: S.nextId++, cls: S.activeClass, shape: S.draft};
    S.labels.push(nl); S.draft = null; S.labelsChanged = true;
    const g = $('[data-act="gen"]'); if (g) g.disabled = false;
    renderDynamic(); drawCanvas();
    if (tooSmall(nl)) toast(smallMsg([nl]).replace(/ Remove or redraw it\.$/, ''));
    return;
  }
  if (a === 'view') { const id = +act.dataset.id; S.flash = id; drawCanvas(); setTimeout(() => { if (S.flash === id) { S.flash = null; drawCanvas(); } }, 1200); return; }
  if (a === 'del') { const id = +act.dataset.id; return modal('Delete Annotation', 'Are you sure you want to delete this annotation?', 'Confirm', () => { S.labels = S.labels.filter(l => l.id !== id); S.labelsChanged = true; renderBody(); drawCanvas(); }); }
});
body.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'ratio') {
    S.ratio = t.value;
    if (!ratioOk() && S.unit !== 'px') S.unit = 'px';
    renderDynamic(); return;
  }
  if (t.dataset.gt != null) { S.gt[t.dataset.gt].v[+t.dataset.k] = t.value; renderFoot(); }
});
body.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.gt != null) renderBody();
});
$('#brushSize').addEventListener('input', e => { S.brush = +e.target.value; $('#brushVal').textContent = S.brush + ' px'; });

const drawingUnconfirmed = () => S.draft && S.draft.strokes.length;
$('#pfoot').addEventListener('click', e => {
  if (e.target.id === 'pBack') {
    if (drawingUnconfirmed()) return toast('Confirm annotation to proceed');
    if (S.step > 0) { S.step--; S.activeClass = null; S.draft = null; renderPanel(); drawCanvas(); }
    else closePanel();
  }
  if (e.target.id === 'pNext') onNext();
});
$('#closeX').addEventListener('click', () => {
  if (drawingUnconfirmed()) return toast('Confirm annotation to proceed');
  if (S.configured) return closePanel();
  modal('Discard changes', 'Are you sure you want to close this module configuration & discard any changes done for it?', 'Discard', closePanel, 'discard');
});

function onNext() {
  if (S.step === 0) { if (!S.saId) return toast('Please select base search area'); S.step = 1; return renderPanel(); }
  if (S.step === 1) {
    if (drawingUnconfirmed()) return toast('Confirm annotation to proceed');
    if (setupBlocked()) return;
    S.step = 2; S.activeClass = null; S.draft = null; renderPanel(); drawCanvas(); return;
  }
  if (S.labelsChanged) toast('Changes Saved', 's');
  S.labelsChanged = false; S.configured = true; S.step = 0;
  toast('Module changes saved!', 's');
  closePanel();
}

window.addEventListener('resize', () => { layoutCanvas(); renderTree(); closeList(); syncTools(); });
buildImage(); renderPanel(); renderTree(); layoutCanvas();
</script>
</body>
</html>
